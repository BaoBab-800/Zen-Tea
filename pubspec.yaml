name: zentea
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.0
  intl: any
  go_router: ^14.0.0
  package_info_plus: ^8.0.0
  provider: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_drawing: ^1.0.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/teas/
    - assets/world.svg

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  ios: true

  windows:
    generate: true